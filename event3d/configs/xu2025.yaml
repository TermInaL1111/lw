# Xu2025: Towards End-to-End Neuromorphic Event-based 3D Reconstruction
# ===================================================================
# Baseline: DenseVoxel E2V (Chen et al., ICVR 2023)
# Improvements: Sobel Event Frame + ECA + FocalLoss
# Target: mIoU 0.523 (Tiny) / 0.535 (Full)

data:
  dataset_root: "data/SynthEVox3D"
  dataset_size: "tiny"
  num_classes: 13
  num_frames: 100
  time_window_ms: 5.0
  image_size: 256
  voxel_size: 32
  train_split: 0.8
  val_split: 0.1

model:
  # Sobel edge-enhanced Event Frame (Pos) — key Xu2025 improvement
  event_representation: "sobel_event_frame_pos"
  # ECA (Efficient Channel Attention) in encoder Bottleneck blocks
  use_eca: true
  # Input channels (1 for event frame, 3 for MCEF)
  encoder_in_channels: 1
  # Dropout rate (Xu2025: 0.25)
  dropout: 0.25
  voxel_size: 32

training:
  batch_size: 5
  num_epochs: 100
  # Xu2025 uses Adam with lr=1e-6 (10x smaller than DenseVoxel)
  learning_rate: 1.0e-6
  weight_decay: 0.0
  # Adam with beta=(0.9, 0.999) — Xu2025 paper
  optimizer: "adam"
  scheduler: "none"
  scheduler_step: 50
  scheduler_gamma: 0.1
  # FocalLoss with alpha=0.25, gamma=2.0
  loss: "focal"
  focal_alpha: 0.25
  focal_gamma: 2.0
  gradient_accumulation_steps: 1
  mixed_precision: false
  num_workers: 4
  seed: 42

evaluation:
  # Higher optimal threshold for Sobel Event Frame (Xu2025 reports ~0.34)
  threshold: 0.34
  search_threshold: true
  threshold_range: [0.20, 0.50]
  threshold_step: 0.01
  metrics: ["iou", "fscore"]
  fscore_threshold: 0.2

checkpoint:
  save_dir: "checkpoints_xu2025"
  save_best: true
  save_interval: 10
  resume_from: null

logging:
  log_dir: "logs_xu2025"
  print_interval: 10
  eval_interval: 1
