# Event3D Training Configuration
# =====================================

data:
  dataset_root: "data/SynthEVox3D"
  dataset_size: "tiny"          # "tiny" or "full"
  num_classes: 13
  num_frames: 100               # 0.5s / 5ms = 100 frames
  time_window_ms: 5.0
  image_size: 256
  voxel_size: 32
  train_split: 0.8
  val_split: 0.1

model:
  # Event representation: "event_frame_pos" | "sobel_event_frame_pos"
  event_representation: "event_frame_pos"
  # Use ECA (Efficient Channel Attention) — Xu2025 improvement
  use_eca: false
  # Input channels to encoder (1 for Event Frame, 3 for MCEF)
  encoder_in_channels: 1
  # Output voxel resolution
  voxel_size: 32

training:
  batch_size: 5
  num_epochs: 100
  learning_rate: 1.0e-5
  weight_decay: 0.0
  optimizer: "adamw"        # "adam" | "adamw" | "sgd"
  scheduler: "none"         # "none" | "cosine" | "step"
  scheduler_step: 50
  scheduler_gamma: 0.1
  loss: "bce"               # "bce" (paper) | "focal" | "dice"
  focal_alpha: 0.25
  focal_gamma: 2.0
  gradient_accumulation_steps: 1
  mixed_precision: false
  num_workers: 4
  seed: 42

evaluation:
  # Threshold for binarizing occupancy probabilities
  threshold: 0.2
  # Whether to search for optimal threshold
  search_threshold: true
  threshold_range: [0.10, 0.50]
  threshold_step: 0.01
  metrics: ["iou", "fscore"]
  fscore_threshold: 0.2   # 20% threshold for F-Score (as per E2V paper)

checkpoint:
  save_dir: "checkpoints"
  save_best: true
  save_interval: 10         # Save every N epochs
  resume_from: null

logging:
  log_dir: "logs"
  print_interval: 10        # Print every N batches
  eval_interval: 1          # Evaluate every N epochs
